# 默认超参数（对应 PDF 第 5 节可调项）

task: translation
paths:
  train_src: data/multi30k/train.de
  train_tgt: data/multi30k/train.en
  val_src: data/multi30k/val.de
  val_tgt: data/multi30k/val.en
  test_src: data/multi30k/test.de
  test_tgt: data/multi30k/test.en

model:
  d_model: 256
  d_ff: 1024
  num_heads: 8
  num_layers: 3
  dropout: 0.1
  max_len: 128

vocab:
  min_freq: 2
  max_size: 8000

train:
  batch_size: 64
  lr: 0.0003
  epochs: 20
  grad_clip: 1.0
  log_every: 50
  num_workers: 0

reverse_toy:
  vocab_size: 64
  train_samples: 20000
  val_samples: 1024
  steps_per_epoch: 200

seed: 42
device: auto
