# 快速冒烟：小模型、少轮次、CPU 友好（语料仍为 data/corpus）。

task: translation
paths:
  train_src: data/corpus/train.de
  train_tgt: data/corpus/train.en
  val_src: data/corpus/val.de
  val_tgt: data/corpus/val.en
  test_src: data/corpus/test.de
  test_tgt: data/corpus/test.en

model:
  d_model: 128
  d_ff: 512
  num_heads: 8
  num_layers: 2
  dropout: 0.1
  max_len: 64

vocab:
  min_freq: 1
  max_size: 4000

train:
  batch_size: 32
  lr: 0.0003
  epochs: 2
  grad_clip: 1.0
  log_every: 50
  num_workers: 0

reverse_toy:
  vocab_size: 64
  train_samples: 5000
  val_samples: 256
  steps_per_epoch: 100

seed: 42
device: cpu
