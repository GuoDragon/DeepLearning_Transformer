<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="540" viewBox="0 0 1080 540">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#344054"/></marker>
    <style>
      text{font-family:"PingFang SC","Noto Sans CJK SC",Arial,sans-serif;fill:#1d2939}.title{font-size:34px;font-weight:700}.label{font-size:21px;font-weight:700}.small{font-size:17px}.box{rx:18;stroke:#344054;stroke-width:2}.line{stroke:#344054;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1080" height="540" fill="#fbfcff"/>
  <text x="540" y="54" text-anchor="middle" class="title">Scaled Dot-Product Attention: Q、K、V 如何工作</text>
  <rect x="70" y="115" width="180" height="80" class="box" fill="#eaf6ff"/><text x="160" y="150" text-anchor="middle" class="label">Q Query</text><text x="160" y="175" text-anchor="middle" class="small">我想找什么？</text>
  <rect x="70" y="230" width="180" height="80" class="box" fill="#fff2cc"/><text x="160" y="265" text-anchor="middle" class="label">K Key</text><text x="160" y="290" text-anchor="middle" class="small">我有什么标签？</text>
  <rect x="70" y="345" width="180" height="80" class="box" fill="#e9fce9"/><text x="160" y="380" text-anchor="middle" class="label">V Value</text><text x="160" y="405" text-anchor="middle" class="small">我能提供什么？</text>
  <path class="line" d="M250 155 H350"/><path class="line" d="M250 270 H350"/>
  <rect x="350" y="165" width="210" height="92" class="box" fill="#ffffff"/><text x="455" y="202" text-anchor="middle" class="label">相似度分数</text><text x="455" y="230" text-anchor="middle" class="small">QKᵀ / √dₖ</text>
  <path class="line" d="M560 211 H650"/>
  <rect x="650" y="165" width="170" height="92" class="box" fill="#f4ebff"/><text x="735" y="202" text-anchor="middle" class="label">Softmax</text><text x="735" y="230" text-anchor="middle" class="small">得到权重</text>
  <path class="line" d="M820 211 H900"/>
  <rect x="900" y="165" width="140" height="92" class="box" fill="#fffaeb"/><text x="970" y="202" text-anchor="middle" class="label">权重 A</text><text x="970" y="230" text-anchor="middle" class="small">每行和为 1</text>
  <path class="line" d="M250 385 C520 385,730 395,900 255"/>
  <rect x="720" y="355" width="250" height="70" class="box" fill="#ecfdf3"/><text x="845" y="382" text-anchor="middle" class="label">输出 = A V</text><text x="845" y="408" text-anchor="middle" class="small">按注意力权重加权求和</text>
  <path class="line" d="M970 257 V355"/>
</svg>
