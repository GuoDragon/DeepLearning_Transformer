<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="560" viewBox="0 0 1080 560">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#344054"/></marker>
    <style>text{font-family:"PingFang SC","Noto Sans CJK SC",Arial,sans-serif;fill:#1d2939}.title{font-size:34px;font-weight:700}.label{font-size:20px;font-weight:700}.small{font-size:16px}.box{rx:18;stroke:#344054;stroke-width:2}.line{stroke:#344054;stroke-width:3;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1080" height="560" fill="#fffdfa"/>
  <text x="540" y="54" text-anchor="middle" class="title">Multi-Head Attention: 多个角度同时看句子</text>
  <rect x="70" y="235" width="160" height="80" class="box" fill="#eaf6ff"/><text x="150" y="268" text-anchor="middle" class="label">输入 Q,K,V</text><text x="150" y="294" text-anchor="middle" class="small">d_model 维</text>
  <path class="line" d="M230 275 H310"/>
  <g>
    <rect x="310" y="90" width="180" height="62" class="box" fill="#dff7ff"/><text x="400" y="126" text-anchor="middle" class="label">Head 1</text>
    <rect x="310" y="175" width="180" height="62" class="box" fill="#ffe8d6"/><text x="400" y="211" text-anchor="middle" class="label">Head 2</text>
    <rect x="310" y="260" width="180" height="62" class="box" fill="#e9fce9"/><text x="400" y="296" text-anchor="middle" class="label">Head 3</text>
    <rect x="310" y="345" width="180" height="62" class="box" fill="#f4ebff"/><text x="400" y="381" text-anchor="middle" class="label">...</text>
    <rect x="310" y="430" width="180" height="62" class="box" fill="#fff2cc"/><text x="400" y="466" text-anchor="middle" class="label">Head h</text>
  </g>
  <path class="line" d="M230 275 C260 120,285 120,310 120"/><path class="line" d="M230 275 C260 205,285 205,310 205"/><path class="line" d="M230 275 C260 290,285 290,310 290"/><path class="line" d="M230 275 C260 375,285 375,310 375"/><path class="line" d="M230 275 C260 460,285 460,310 460"/>
  <rect x="610" y="230" width="170" height="90" class="box" fill="#ffffff"/><text x="695" y="266" text-anchor="middle" class="label">Concat</text><text x="695" y="292" text-anchor="middle" class="small">拼接所有头</text>
  <path class="line" d="M490 120 C555 120,555 275,610 275"/><path class="line" d="M490 205 C555 205,555 275,610 275"/><path class="line" d="M490 290 H610"/><path class="line" d="M490 375 C555 375,555 275,610 275"/><path class="line" d="M490 460 C555 460,555 275,610 275"/>
  <path class="line" d="M780 275 H860"/>
  <rect x="860" y="230" width="160" height="90" class="box" fill="#ecfdf3"/><text x="940" y="266" text-anchor="middle" class="label">Wᴼ 投影</text><text x="940" y="292" text-anchor="middle" class="small">回到 d_model</text>
  <text x="540" y="525" text-anchor="middle" class="small">不同头可以分别关注语法、语义、指代、局部上下文和翻译对齐等关系</text>
</svg>
